<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Ledgerly Financial Ledger</title>
  <link rel="stylesheet" href="/css/ledger.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖋️</text></svg>">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <a href="/login.html" class="brand-mark">
        <div class="brand-icon">L</div>
        <span class="brand-title">Ledgerly</span>
      </a>
      <h1 class="auth-title">Access Your Ledger</h1>
      <p class="auth-subtitle">Precision financial recording and budget management.</p>
    </div>

    <!-- Friendly Error Banner (Populated via JS or OAuth redirect error) -->
    <div id="auth-error-banner" class="auth-error-banner" style="display: none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span class="error-text">Authentication failed.</span>
    </div>

    <!-- Official Google Sign-In Button -->
    <a href="/oauth2/authorization/google" class="btn-google" id="google-auth-btn">
      <svg class="google-icon-svg" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
      </svg>
      <span>Continue with Google</span>
    </a>

    <div class="auth-divider">or with email credentials</div>

    <!-- Email + Password Form -->
    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="name@domain.com" autocomplete="email" required>
        <div class="field-error"></div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••••••" autocomplete="current-password" required>
        <div class="field-error"></div>
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
        Sign In to Ledger
      </button>
    </form>

    <div style="margin-top: 1.75rem; text-align: center; font-size: 0.85rem; color: var(--ink-secondary);">
      Need a new account? <a href="/register.html">Create a ledger</a>
    </div>

    <div style="margin-top: 1.5rem; text-align: center;">
      <button type="button" class="btn btn-secondary btn-sm" id="theme-toggle" style="font-size: 0.75rem;">
        Toggle Light / Dark Mode
      </button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
